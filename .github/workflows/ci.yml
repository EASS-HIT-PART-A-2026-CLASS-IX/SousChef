name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: pytest + Schemathesis (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      # Runs the whole backend suite, including tests/test_api_contract.py,
      # which fuzzes the CRUD endpoints with Schemathesis against the
      # app's own OpenAPI schema.
      - name: Run pytest (unit + Schemathesis contract tests)
        working-directory: backend
        run: uv run pytest -q
