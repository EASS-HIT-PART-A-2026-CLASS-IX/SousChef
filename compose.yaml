services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/recipes')"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Service-to-service admin auth so the UI can call protected routes
      # (e.g. delete). Not a user-facing login. ADMIN_PASSWORD is the plaintext
      # whose hash the backend stores in ADMIN_PASSWORD_HASH.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    command: python /app/scripts/refresh.py
    env_file: .env
    environment:
      - API_BASE_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./scripts:/app/scripts
    # The worker reuses the backend image but runs no HTTP server, so the
    # image's inherited HTTP healthcheck would always fail. Disable it.
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
